<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Photographique — test SHARP</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font: 11px 'Space Grotesk', sans-serif; color: rgba(255,255,255,.5); }
    #hud { position: fixed; left: 12px; bottom: 10px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="hud">chargement…</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    // ?ply=IMG_003_molecules (dans Ressources/sharp/) ; &format=ply pour lire les .ply bruts au lieu des .spz compressés
    const params = new URLSearchParams(location.search);
    const file = params.get("ply") || "IMG_001_molecules";
    const ext = params.get("format") === "ply" ? "ply" : "spz";
    const hud = document.getElementById("hud");

    const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Photo de départ : ?ply=IMG_003_molecules.ply, sinon photo 1 en style molécules
    const m0 = file.match(/IMG_00(\d)(_molecules)?/);
    let photo = m0 ? +m0[1] : 1, molecules = m0 ? !!m0[2] : true;
    let mesh = null, loading = false;

    async function load() {
      if (loading) return; loading = true;
      const name = `IMG_00${photo}${molecules ? "_molecules" : ""}.${ext}`;
      hud.textContent = `chargement ${name}…`;
      // SHARP : repère OpenCV (x droite, y bas, z devant) -> on retourne de 180° autour de X pour three.js
      const next = new SplatMesh({ url: `./Ressources/sharp/${name}` });
      next.quaternion.set(1, 0, 0, 0);
      await next.initialized;
      // Molécules : bord plus net (falloff) et boule coupée à 2 écarts-types ; brut : réglages Spark par défaut
      spark.falloff = molecules ? 0.5 : 1;
      spark.maxStdDev = molecules ? 2 : Math.sqrt(8);
      if (mesh) { scene.remove(mesh); mesh.dispose(); }
      mesh = next; scene.add(mesh);
      // Centrer la caméra : on regarde la scène depuis le point de prise de vue (l'origine)
      const box = mesh.getBoundingBox ? mesh.getBoundingBox() : null;
      const center = new THREE.Vector3(0, 0, -2);
      if (box && !box.isEmpty()) { box.getCenter(center); center.applyQuaternion(mesh.quaternion); }
      camera.position.set(0, 0, 0);
      controls.target.set(0, 0, center.z);
      controls.update();
      hud.textContent = `photo ${photo}/7 · ${molecules ? "molécules" : "brut"} · ${mesh.packedSplats.numSplats.toLocaleString("fr")} gaussiennes · ← → photo · M molécules/brut · glisser = tourner · molette = avancer · clic droit = déplacer`;
      window.sharpTest.mesh = mesh;
      loading = false;
    }

    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { photo = photo % 7 + 1; load(); }
      if (e.key === "ArrowLeft") { photo = (photo + 5) % 7 + 1; load(); }
      if (e.key >= "1" && e.key <= "7") { photo = +e.key; load(); }
      if (e.key === "m" || e.key === "M") { molecules = !molecules; load(); }
    });

    window.sharpTest = { spark, camera, controls, THREE, load };
    await load();
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
